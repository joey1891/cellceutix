<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CellCeutix - Biotech Skincare</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configure Custom Colors for Prism Effect -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        prism: {
                            deep: '#4b3075',
                            mid: '#a882d4',
                            light: '#f4c8a2'
                        }
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Load Montserrat Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;0,900;1,300;1,400;1,600;1,700;1,900&display=swap" rel="stylesheet">
    
    <style>
        /* Base styles */
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: black;
            color: white;
            /* Prevent scrolling as requested */
            overflow: hidden; 
        }
        
        ::selection {
            background-color: #a882d4;
            color: white;
        }
    </style>
</head>

<body class="h-screen w-screen m-0 p-0">

    <header id="navbar" class="fixed top-0 left-0 w-full z-50 transition-all duration-300 bg-transparent py-6">
        <div class="container mx-auto px-6 md:px-12 flex justify-between items-center">
            
            <!-- Logo -->
            <div class="text-2xl font-bold tracking-tighter flex items-center cursor-pointer">
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#9476b7] via-[#e2a893] to-[#f4d4b1]">Cell</span><span class="text-prism-mid">Ceutix</span>
            </div>

            <!-- Desktop Menu -->
            <nav class="hidden md:flex space-x-8">
                <a href="#" class="text-sm font-medium text-gray-300 hover:text-white transition-colors duration-200">Brand Mission</a>
                <a href="#" class="text-sm font-medium text-gray-300 hover:text-white transition-colors duration-200">Brand Vision</a>
                <a href="#" class="text-sm font-medium text-gray-300 hover:text-white transition-colors duration-200">Core Technology</a>
                <a href="#" class="text-sm font-medium text-gray-300 hover:text-white transition-colors duration-200">Products</a>
                <a href="#" class="text-sm font-medium text-gray-300 hover:text-white transition-colors duration-200">Partnerships</a>
            </nav>

            <!-- Mobile Menu Toggle Button -->
            <button id="mobile-menu-btn" class="md:hidden text-gray-300 hover:text-white focus:outline-none">
                <!-- Hamburger Icon -->
                <svg id="icon-menu" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
                <!-- Close Icon (Hidden by default) -->
                <svg id="icon-close" class="hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- Mobile Menu Dropdown -->
        <div id="mobile-menu" class="hidden md:hidden absolute top-full left-0 w-full bg-black/95 border-t border-gray-800 py-4 backdrop-blur-md">
            <nav class="flex flex-col px-6 space-y-4">
                <a href="#" class="text-lg font-medium text-gray-300 hover:text-white mobile-link">Brand Mission</a>
                <a href="#" class="text-lg font-medium text-gray-300 hover:text-white mobile-link">Brand Vision</a>
                <a href="#" class="text-lg font-medium text-gray-300 hover:text-white mobile-link">Core Technology</a>
                <a href="#" class="text-lg font-medium text-gray-300 hover:text-white mobile-link">Products</a>
                <a href="#" class="text-lg font-medium text-gray-300 hover:text-white mobile-link">Partnerships</a>
            </nav>
        </div>
    </header>

    <main class="relative w-full h-full flex items-center justify-center overflow-hidden">
        
        <!-- Background Video -->
        <div class="absolute inset-0 w-full h-full z-0">
            <video 
                autoplay 
                loop 
                muted 
                playsinline 
                class="w-full h-full object-cover scale-105 opacity-80 pointer-events-none"
            >
                <source src="https://rqcuaqsyxkfapoyqiwxy.supabase.co/storage/v1/object/sign/Homepage/0919.mp4?token=eyJraWQiOiI5ZjRiNThmMy1lMDAyLTQ3NzMtYWRjZi1iYTlhNDc0MjUzZjQiLCJhbGciOiJIUzUxMiJ9.eyJ1cmwiOiJIb21lcGFnZS8wOTE5Lm1wNCIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3ODk4MDAxOTcsImV4cCI6MTgyMTMzNjE5N30.UITim8OdWrwZPBDaweWf_Jams5nPDu5RPS6aqJq3DMGUw9PSMR0-Qf9s2nMmkdqI6P8RTQpw6NutiwV3NwN1jw" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            
            <!-- Dark Gradient Overlay for text readability (Purple removed) -->
            <div class="absolute inset-0 bg-gradient-to-r from-black/90 via-black/50 to-transparent"></div>
        </div>

        <!-- Main Content Container positioned top-left -->
        <div class="relative z-10 container mx-auto px-6 md:px-12 h-full flex flex-col justify-center items-start pt-20">
            
            <!-- Main Copy with Quotes, Italics, Thicker Weights, and White Color -->
            <h1 id="typewriter-container" class="leading-none max-w-5xl text-left flex flex-col items-start min-h-[300px] italic drop-shadow-2xl">
                <div class="flex items-end flex-wrap mb-2">
                    <span class="text-2xl sm:text-3xl md:text-4xl font-medium text-white tracking-wide" data-text="“Skin aging is a "></span>
                </div>
                <div class="mb-8 md:pl-8 mt-1">
                    <span class="text-6xl sm:text-7xl md:text-[6.5rem] font-black tracking-tighter text-white" data-text="Disease."></span>
                </div>
                <div class="flex items-baseline gap-4 flex-wrap mt-2 md:pl-4">
                    <span class="text-xl sm:text-2xl md:text-3xl font-medium text-white tracking-wide" data-text="We provide the "></span>
                    <span class="text-6xl sm:text-7xl md:text-[6.5rem] font-black tracking-tighter text-white" data-text="Cure.”"></span>
                </div>
            </h1>
            
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const mobileMenuBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            const iconMenu = document.getElementById('icon-menu');
            const iconClose = document.getElementById('icon-close');
            const mobileLinks = document.querySelectorAll('.mobile-link');
            const navbar = document.getElementById('navbar');

            // Toggle mobile menu
            mobileMenuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
                iconMenu.classList.toggle('hidden');
                iconClose.classList.toggle('hidden');
                
                // Add dark background to header when menu is open
                if (!mobileMenu.classList.contains('hidden')) {
                    navbar.classList.remove('bg-transparent');
                    navbar.classList.add('bg-black/90', 'backdrop-blur-md');
                } else {
                    navbar.classList.add('bg-transparent');
                    navbar.classList.remove('bg-black/90', 'backdrop-blur-md');
                }
            });

            // Close mobile menu when a link is clicked
            mobileLinks.forEach(link => {
                link.addEventListener('click', () => {
                    mobileMenu.classList.add('hidden');
                    iconMenu.classList.remove('hidden');
                    iconClose.classList.add('hidden');
                    navbar.classList.add('bg-transparent');
                    navbar.classList.remove('bg-black/90', 'backdrop-blur-md');
                });
            });

            // Typewriter Effect Logic
            const elements = document.querySelectorAll('#typewriter-container [data-text]');
            let currentElementIndex = 0;
            let currentCharIndex = 0;
            const typingSpeed = 120; // 타이핑 속도 대폭 늦춤 (기존 50 -> 120)

            function typeNextChar() {
                // Check if all elements have finished typing
                if (currentElementIndex >= elements.length) {
                    return; // 설명글(Description) 페이드인 로직 삭제
                }

                const el = elements[currentElementIndex];
                const text = el.getAttribute('data-text');

                if (currentCharIndex < text.length) {
                    el.innerHTML += text.charAt(currentCharIndex);
                    currentCharIndex++;
                    setTimeout(typeNextChar, typingSpeed);
                } else {
                    currentElementIndex++;
                    currentCharIndex = 0;
                    // 문장 사이의 간격을 좀 더 여유롭게 주어 호흡을 늦춤
                    setTimeout(typeNextChar, typingSpeed + 400); 
                }
            }

            // Start typewriter after a short delay on initial load
            setTimeout(typeNextChar, 800);
        });
    </script>
</body>
</html>
